# 知行读书 — GitHub Actions CI

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

# 取消进行中的同 workflow（避免资源浪费）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint + Typecheck + Test + Build
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        timeout-minutes: 8

      - name: ESLint (R10 硬约束)
        run: npm run lint
        timeout-minutes: 3

      - name: TypeScript (strict mode)
        run: npm run typecheck
        timeout-minutes: 5

      # 覆盖率门禁（vitest.config.ts 的 thresholds：lines 83 / branches 80 / functions 75 /
      # statements 83）只有跑 `--coverage` 才生效 —— 2026-09-24 之前 CI 跑的是不带覆盖率的
      # `npm run test`，那套阈值在 CI 上是**装饰**，本地不手动跑 test:cov 没人会因它红。
      # 老注释说"要先 pnpm install 才能开"也已作废：@vitest/coverage-v8 与 vitest 同为 3.2.7。
      - name: Vitest + coverage thresholds (R6 硬约束)
        run: npm run test:cov
        timeout-minutes: 8

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/index.html
            coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: warn

      - name: Build (主 + 预加载 + 渲染)
        run: npm run build
        timeout-minutes: 8

