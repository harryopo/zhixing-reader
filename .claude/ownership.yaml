# File Ownership — 知行读书 Sub-agent 文件域声明

> **作用**：多 Sub-agent 并行开发时声明文件所有权，防止越界编辑
> **详细规范**：ai-dev-workflow §七（Sub-agent 编排策略）
> **当前状态**：单 agent 模式（比赛期间），本文件作为未来扩展用

---

## 1. 域声明

```yaml
# 知行读书多 agent 文件所有权
version: 1

agents:
  # ====== 渲染进程（前端） ======
  renderer-agent:
    role: "负责 src/renderer/src/** 全部 React + 状态管理"
    domains:
      - "src/renderer/src/**"
    forbidden:
      - "electron/**"
      - "shared/**"
    exclusive:
      - "src/renderer/src/stores/**"  # Zustand stores 独占
      - "src/renderer/src/styles/**"  # 样式独占

  # ====== 主进程（后端） ======
  backend-agent:
    role: "负责 electron/** 全部主进程 + DB + AI 服务"
    domains:
      - "electron/**"
    forbidden:
      - "src/renderer/src/**"
      - "src/shared/**"  # 共享层需协调
    exclusive:
      - "electron/database.ts"          # 数据库独占
      - "electron/repositories/**"      # 仓储层独占
      - "electron/services/**"          # 业务服务独占
      - "electron/agent/**"             # 智能体独占
      - "electron/ai-service.ts"        # AI 服务独占
      - "electron/weread-api.ts"        # 微信读书 API 独占
      - "electron/fsrs-engine.ts"       # FSRS 引擎独占

  # ====== 共享层（需协调） ======
  shared-agent:
    role: "负责跨进程共享的类型/常量，修改需通知另一方"
    domains:
      - "src/shared/**"
    forbidden:
      - "src/renderer/src/**"
      - "electron/**"
    exclusive:
      - "src/shared/types.ts"
      - "src/shared/ipc-channels.ts"
      - "src/shared/constants.ts"

  # ====== 测试（只读源码） ======
  test-agent:
    role: "只读源码，只写测试"
    domains:
      - "tests/**"
    forbidden:
      - "electron/**"      # 只读
      - "src/renderer/src/**"  # 只读
    read_only:
      - "electron/**"
      - "src/renderer/src/**"

  # ====== 文档（信息检索） ======
  docs-agent:
    role: "负责 AGENTS.md / CLAUDE.md / .claude/rules/ / .learnings/"
    domains:
      - "AGENTS.md"
      - "CLAUDE.md"
      - ".claude/**"
      - ".learnings/**"
      - "docs/**"
    forbidden:
      - "electron/**"
      - "src/renderer/**"

  # ====== 基础设施（构建/配置） ======
  infra-agent:
    role: "负责构建/CI/依赖/Husky"
    domains:
      - "package.json"
      - "package-lock.json"
      - "tsconfig.json"
      - "tsconfig.web.json"
      - "tsconfig.node.json"
      - "electron.vite.config.ts"
      - "eslint.config.js"
      - "postcss.config.js"
      - "tailwind.config.js"
      - ".github/**"
      - ".husky/**"
      - "vitest.config.ts"
    forbidden:
      - "electron/**"
      - "src/renderer/src/**"
```

