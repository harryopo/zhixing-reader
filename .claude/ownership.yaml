## 3. 当前（单 Agent）模式

比赛期间（11 天冲刺），所有修改由主 agent 完成，本文件作为未来扩展的 reference。

**当前规则**：
- 修改任何文件前必读 `AGENTS.md` 确认架构
- 修改 IPC 通道：必须同步修改 `shared/ipc-channels.ts` + `preload.ts` + `ipc.ts` 三处
- 修改 DB schema：必须用 `PRAGMA table_info` 检查后再 `ALTER TABLE`

