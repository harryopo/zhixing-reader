## 4. Sub-agent 调用约定

| Sub-agent | 何时调用 | 输入 | 输出 |
|-----------|---------|------|------|
| `code-reviewer` | 提交前、PR review | diff / 文件 | 7 维审查报告 |
| `test-writer` | 新增功能、Bug 修复 | 源文件 | vitest 测试文件 |
| `frontend-design` | UI 改动 | 描述 + 草图 | 设计 + 代码 |
| `debugging-strategies` | 复杂 Bug | 错误日志 + 复现步骤 | 假设 → 验证 |
| `requesting-code-review` | 大功能完成 | 功能描述 | 审查请求 |

