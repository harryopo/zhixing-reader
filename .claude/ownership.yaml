## 2. 共享文件修改协议

当 Sub-agent A 需要修改另一 agent 的 exclusive 文件时：

```
A 发起请求 ──→ 主协调器（人）审批
                  │
                  ├─→ 通知 B："A 需要修改 X，是否同意"
                  ├─→ B 同意
                  └─→ A 获得临时锁（1 小时）
                       │
                       └─→ A 修改
                            │
                            └─→ A 释放锁
                                 │
                                 └─→ 通知 B 验证
```

**示例**：renderer-agent 要新增 IPC 通道，需要修改 `shared/ipc-channels.ts`（shared-agent exclusive）

```
1. renderer-agent 在 shared-agent 域中发起 PR
2. 人在协调器中授权（临时 lock shared-agent）
3. renderer-agent 在 shared/ipc-channels.ts 加常量
4. renderer-agent 在 electron/preload.ts 暴露 API（属于 backend-agent exclusive）
5. backend-agent 收到通知，在 ipc.ts 注册 handler
6. 全部完成后释放 lock
```

